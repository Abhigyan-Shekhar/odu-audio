# Streaming Pipeline Configuration
# For real-time audio processing with latency constraints

capture:
  sample_rate: 16000
  buffer_seconds: 10.0
  chunk_size: 480  # 30 ms at 16 kHz
  device_index: null  # null = default device
  channels: 1  # mono

preprocessing:
  target_sample_rate: 16000
  resampling_method: "kaiser_best"  # high-quality anti-aliasing
  normalization: true
  dc_offset_removal: true

vad:
  model: "silero_vad_v4"
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 100
  speech_pad_ms: 30
  window_size_samples: 512
  
diarization:
  mode: "provisional"  # provisional | batch
  model: "pyannote/speaker-diarization"
  min_speakers: 1
  max_speakers: 4
  embedding_model: "pyannote/embedding"
  segmentation_onset: 0.5
  segmentation_offset: 0.5

enrollment:
  method: "session_start"  # session_start | manual | channel | embedding
  duration_seconds: 5.0
  confidence_threshold: 0.7
  allow_fallback: true
  channel_index: null  # for channel assignment method
  reference_embedding_id: null  # for embedding match method

quality:
  clipping_threshold: 0.99  # samples >= this are considered clipped
  clipping_max_ratio: 0.05  # max acceptable clipping ratio
  dropout_zero_threshold: 1e-6  # samples below this are considered dropout
  dropout_max_ratio: 0.10  # max acceptable dropout ratio
  snr_min_db: 10.0  # minimum acceptable SNR

features:
  egemaps:
    enable: true
    window_seconds: 2.0
    hop_seconds: 0.5
    minimum_voiced_ratio: 0.40
    feature_set: "eGeMAPSv02"
    feature_level: "Functionals"  # 88 features
    config_file: null  # use default openSMILE config
  
  yamnet:
    enable: true
    native_window_seconds: 0.96
    native_hop_seconds: 0.48
    aggregation: "max"  # max | mean | median
    event_classes:
      - "Scream"
      - "Crying, sobbing"
      - "Yell"
      - "Gasp"
      - "Groan"
      - "Whimper"
      - "Wheeze"
    min_probability: 0.1  # filter events below this
  
  emotion2vec:
    enable: true
    window_seconds: 3.0
    hop_seconds: 1.0
    pooling: "mean"  # mean | max
    model: "emotion2vec_base"

storage:
  output_path: "./output/acoustic_features.parquet"
  buffer_size: 100  # buffer this many records before writing
  compression: "snappy"
  write_dropped_records: true
  dropped_records_path: "./output/dropped_records.parquet"

degradation:
  enable: true
  backpressure_threshold_ms: 500.0
  level_1_trigger_ms: 200.0  # reduce emotion2vec frequency
  level_2_trigger_ms: 500.0  # disable emotion2vec
  level_3_trigger_ms: 1000.0  # disable diarization refinement
  level_4_trigger_ms: 2000.0  # minimal features only
  level_5_trigger_ms: 5000.0  # quality monitoring only
  recovery_delay_seconds: 5.0
  recovery_threshold_ratio: 0.5

privacy:
  pseudonymize_ids: true
  encrypt_temp_files: true
  audit_logging: true
  audit_log_path: "./logs/audit.log"
  retention_days: 90

logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  console: true
  file: "./logs/streaming.log"
  rotation: "1 day"
  max_size_mb: 100
