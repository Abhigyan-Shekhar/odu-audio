# Phase 1 static fusion baseline configuration.
training:
  label_column: verbal_agitation_label
  group_column: patient_id
  validation_size: 0.2
  random_state: 42
  n_estimators: 500
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 20
  early_stopping_rounds: 50
  class_weight: balanced
  calm_profanity_column: calm_profanity_label
  event_hours_column: duration_hours
