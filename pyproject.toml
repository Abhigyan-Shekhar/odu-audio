[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-pipeline"
version = "0.1.0"
description = "Audio Pipeline and Acoustic Modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "resampy>=0.4.2",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "huggingface-hub>=0.16.0",
    "opensmile>=2.5.0",
    "tensorflow>=2.13.0",
    "tensorflow-hub>=0.14.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
    "typing-extensions>=4.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
